name: 버그 제보
description: 동작이 잘못됨
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        공개 저장소입니다. 개인 강의 내용, 개인 경로, 토큰은 적지 마세요. 재현은 sample 강의로 해 주세요.
  - type: textarea
    id: actual
    attributes:
      label: 현상
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1. npm run dev
        2.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: OS, 브라우저, Node.js 버전, 커밋
